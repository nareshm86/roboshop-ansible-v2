
  - name: create roboshop user
    user:
     name: roboshop
     system: true
     home: /app
     shell: /sbin/nologin
     create_home: false
     comment: "Roboshop System user"
  - name: remove app directory
    file:
      path: /app
      state: absent
  - name: "delete {{ component }}.zip in tmp directory"
    file:
      path: "/tmp/{{ component }}.zip"
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory
  - name: "download {{ component }} service code"
    get_url:
     url: "https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip"
     dest: "/tmp/{{ component }}.zip"

  - name: "unzip {{ component }} file"
    unarchive:
       src: "/tmp/{{ component }}.zip"
       dest: /app
       remote_src: yes